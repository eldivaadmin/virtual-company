<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AI COMPANY OS</title><link rel="stylesheet" href="/static/styles.css"></head><body><div class="top"><b>🏢 AI COMPANY OS</b><span id="clock"></span><span id="conn">接続中…</span><button id="pause">⏸ AI会社を一時停止</button></div><div class="layout"><aside><h3>📑 リアルタイムログ</h3><div id="logs"></div><h3>🧑‍💼 社員</h3><div id="alist"></div></aside><main><div id="office" class="office"><img src="/assets/concept_v2.png" class="concept"><div id="sprites"></div></div><div class="actions"><button data-sim="mail">📨 メール受信</button><button data-sim="accounting">💰 支払期限</button><button data-sim="meeting">📅 会議通知</button><button id="gmail">Gmail今すぐ確認</button><button id="calendar">Calendar確認</button></div><section class="taskbox"><select id="agent"></select><select id="provider"><option value="">社員設定</option><option value="openai">GPT</option><option value="claude">Claude</option></select><textarea id="prompt" placeholder="社員へ仕事を指示。例：今日の予定を整理して、優先順位を付けて"></textarea><button id="runTask">この社員に仕事を任せる</button><pre id="result">ここに実作業の結果が出ます。</pre></section></main><aside><h3>⚙ 接続状態</h3><div id="status"></div><h3>🚨 重要通知</h3><div id="alerts"></div><h3>📅 24時間以内</h3><div id="cal"></div></aside></div><script src="/static/app.js"></script></body></html>
